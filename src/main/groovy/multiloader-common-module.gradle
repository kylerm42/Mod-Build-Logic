plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = project.property("neo_form_version")
    def at = file("src/main/resources/META-INF/accesstransformer.cfg")
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    compileOnly "org.spongepowered:mixin:${project.property('mixin_version')}"
    compileOnly "io.github.llamalad7:mixinextras-common:${project.property('mixin_extras_version')}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${project.property('mixin_extras_version')}"
    implementation "org.jetbrains.kotlin:kotlin-reflect"
}

tasks.named('test') {
    useJUnitPlatform()
}

configurations {
    create("commonJava") {
        canBeResolved = false
        canBeConsumed = true
    }
    create("commonResources") {
        canBeResolved = false
        canBeConsumed = true
    }
}

['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.getByName(variant).outgoing {
        capability("$group:$mod_id:$version")
    }
}

artifacts {
    add("commonJava", sourceSets.main.java.sourceDirectories.singleFile)
    add("commonResources", sourceSets.main.resources.sourceDirectories.singleFile)
}
