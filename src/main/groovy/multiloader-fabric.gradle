plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}


repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${fabric_language_kotlin_version}"
}

// Loom 1.16.x no longer exposes modImplementation configs here, but it does
// provide modCompileClasspath. Ensure it inherits the main deps so Fabric API
// is visible to the mod loader in dev runs.
configurations.matching { it.name == "modCompileClasspath" }.all {
    extendsFrom(configurations.implementation)
}

loom {
    splitEnvironmentSourceSets()

    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Common sources are compiled as part of the client source set, which has full MC+FAPI on its
// classpath (including client-only classes). The main source set only sees common via compileOnly.
afterEvaluate {
    tasks.named('compileClientKotlin') {
        source(project(":common").sourceSets.main.allSource)
    }
}
